version: '3.9'

services:
  # MongoDB Database
  mongodb:
    image: mongo:8.2.0
    container_name: bongal-mongodb
    restart: unless-stopped
    ports:
      - ""
    environment:
      MONGO_INITDB_ROOT_USERNAME: 
      MONGO_INITDB_ROOT_PASSWORD: 
      MONGO_INITDB_DATABASE: db_name
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - bongal-network
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://username:password@localhost:port/bongal", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend Server
  server:
    build:
      context: .
      dockerfile: docker/server.production.Dockerfile
    container_name: bongal-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 
      MONGODB_URI: mongodb://username:password@mongodb:port/bongal?authSource=username
      JWT_SECRET: example
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - server_logs:/app/logs
    networks:
      - bongal-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:port/api', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Client
  client:
    build:
      context: .
      dockerfile: docker/client.production.Dockerfile
      args:
        VITE_API_URL: http://localhost:port/api
    container_name: bongal-client
    restart: unless-stopped
    ports:
      - ""
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bongal-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  server_uploads:
    driver: local
  server_logs:
    driver: local

networks:
  bongal-network:
    driver: bridge
