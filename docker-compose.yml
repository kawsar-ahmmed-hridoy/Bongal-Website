version: '3.9'

services:
  # MongoDB Database
  mongodb:
    image: mongo:8.2.0
    container_name: bongal-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: bongal
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - bongal-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/bongal --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend Server
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: bongal-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:bongal_admin_2025@mongodb:27017/bongal?authSource=admin
      JWT_SECRET: bongal_super_secret_jwt_key_change_in_production_2025
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - server_logs:/app/logs
    networks:
      - bongal-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Client
  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: bongal-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bongal-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  server_uploads:
    driver: local
  server_logs:
    driver: local

networks:
  bongal-network:
    driver: bridge
