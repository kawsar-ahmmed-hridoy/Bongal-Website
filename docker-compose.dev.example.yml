version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: bongal-mongodb-dev
    ports:
      - ""
    environment:
      MONGO_INITDB_ROOT_USERNAME: 
      MONGO_INITDB_ROOT_PASSWORD: 
      MONGO_INITDB_DATABASE: Don't know
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - bongal-dev-network

  server:
    build:
      context: .
      dockerfile: docker/server.dev.Dockerfile
    container_name: bongal-server-dev
    ports:
      - ""
    environment:
      NODE_ENV: development
      PORT: 
      MONGODB_URI: mongodb://mongodb:port/db_name
      JWT_SECRET: example
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:port
    depends_on:
      - mongodb
    volumes:
      - ./bongal-server:/app
      - /app/node_modules
    networks:
      - bongal-dev-network
    command: nodemon --watch src --ext ts,js src/example.ts

  client:
    build:
      context: .
      dockerfile: docker/client.dev.Dockerfile
    container_name: bongal-client-dev
    ports:
      - ""
    environment:
      VITE_API_URL: http://localhost:port/api
    depends_on:
      - server
    volumes:
      - ./bongal-client:/app
      - /app/node_modules
    networks:
      - bongal-dev-network
    command: npm run dev

volumes:
  mongodb_dev_data:
  server_dev_uploads:

networks:
  bongal-dev-network:
    driver: bridge
