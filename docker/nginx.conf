server {
  listen 5000;
  server_name _;

  # Root directory (React build output)
  root /usr/share/nginx/html;

  # Default index file
  index index.html;

  # Handle static files (CSS, JS, images, etc.)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: increase client upload limit
  client_max_body_size 10M;

  # Gzip compression (optional, improves performance)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;
  gzip_min_length 256;
}
